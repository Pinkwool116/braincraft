<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindCraft 知识图谱可视化</title>
<script src="https://cdn.jsdelivr.net/npm/vis-data@7.1.9/peer/umd/vis-data.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --bg: #1a1a1a;
  --panel-bg: #252525;
  --border: #3a3a3a;
  --text: #e0e0e0;
  --text-dim: #999;
  --accent: #4D96FF;
  --highlight: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; }

/* 左侧筛选栏 */
#sidebar { width: 250px; min-width: 250px; background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; overflow-y: auto; gap: 14px; }
#sidebar h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
#sidebar .filter-group { display: flex; flex-direction: column; gap: 5px; }
#sidebar label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 3px 0; }
#sidebar label input[type="checkbox"] { accent-color: var(--accent); }
#sidebar .color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
#search-input { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; }
#search-input:focus { border-color: var(--accent); }
#search-input::placeholder { color: var(--text-dim); }
#invalid-toggle-row { display: flex; align-items: center; justify-content: space-between; }
#invalid-toggle-row span { font-size: 12px; color: var(--text-dim); }
#refresh-btn { padding: 8px 0; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; }
#refresh-btn:hover { opacity: 0.85; }
#search-count { font-size: 11px; color: var(--text-dim); margin-top: -8px; }

/* 中间图画布 */
#main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
#graph-container { flex: 1; min-height: 0; }

/* 加载/错误提示 */
#status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-dim); font-size: 16px; pointer-events: none; text-align: center; }
#status-msg.error { color: #FF6B6B; pointer-events: auto; }

/* 右侧统计面板 */
#stats-panel { width: 200px; min-width: 200px; background: var(--panel-bg); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
#stats-panel h2 { font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
.stat-row .val { font-weight: 600; }
.type-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 3px 0; }
.type-bar .bar-bg { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.type-bar .bar-fill { height: 100%; border-radius: 3px; }
.top-item { font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.top-item .top-type { font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-right: 4px; }
.top-item:hover { color: var(--highlight); }

/* 底部详情面板 */
#detail-panel { position: fixed; bottom: 0; left: 250px; right: 200px; max-height: 280px; background: #1e1e1e; border-top: 2px solid var(--border); display: none; z-index: 10; overflow-y: auto; padding: 16px 20px; font-size: 13px; }
#detail-panel.active { display: block; }
#detail-close { position: absolute; top: 8px; right: 16px; background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
#detail-close:hover { color: var(--highlight); }
#detail-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
#detail-content { font-size: 15px; font-weight: 500; margin-bottom: 10px; color: var(--highlight); }
.detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; margin-bottom: 12px; }
.detail-meta-item { font-size: 12px; word-break: break-all; }
.detail-meta-item .key { color: var(--text-dim); }
#detail-edges { border-top: 1px solid var(--border); padding-top: 10px; }
#detail-edges h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
.detail-edge-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
.detail-edge-row .edge-rel { padding: 1px 5px; border-radius: 3px; font-size: 10px; background: var(--border); flex-shrink: 0; }
.detail-edge-row .linked-node { color: var(--accent); cursor: pointer; }
.detail-edge-row .linked-node:hover { text-decoration: underline; }
.detail-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
</style>
</head>
<body>

<aside id="sidebar">
  <h2>搜索</h2>
  <input type="text" id="search-input" placeholder="输入关键词搜索节点...">
  <div id="search-count"></div>

  <h2>节点类型</h2>
  <div class="filter-group" id="type-filters"></div>

  <h2>边关系</h2>
  <div class="filter-group" id="relation-filters"></div>

  <div id="invalid-toggle-row">
    <span>显示失效节点</span>
    <input type="checkbox" id="show-invalid">
  </div>

  <button id="refresh-btn" title="重新加载数据">刷新数据</button>
</aside>

<div id="main">
  <div id="graph-container"></div>
  <div id="status-msg">加载中...</div>
</div>

<aside id="stats-panel">
  <h2>图统计</h2>
  <div id="stats-content">加载中...</div>
</aside>

<div id="detail-panel">
  <button id="detail-close" title="关闭 (Esc)">&times;</button>
  <div id="detail-type"></div>
  <div id="detail-content"></div>
  <div class="detail-meta" id="detail-meta"></div>
  <div id="detail-edges"></div>
</div>

<script>
(function() {
  // 检查 vis 库是否加载成功
  if (typeof vis === "undefined" || !vis.Network || !vis.DataSet) {
    document.getElementById("status-msg").textContent = "错误: vis-network 库加载失败，请检查网络连接";
    document.getElementById("status-msg").className = "error";
    return;
  }

  var TYPE_COLORS = {
    event:     { bg: "#FF6B6B", border: "#FF4444" },
    place:     { bg: "#4ECDC4", border: "#2EBDB4" },
    person:    { bg: "#FFD93D", border: "#FFC107" },
    item:      { bg: "#6BCB77", border: "#4BBF5A" },
    time:      { bg: "#4D96FF", border: "#2D7AE0" },
    pattern:   { bg: "#FF8B94", border: "#FF6B77" },
    thought:   { bg: "#C084FC", border: "#A855F7" },
    community: { bg: "#FFA94D", border: "#FF922B" }
  };

  var TYPE_LABELS = {
    event: "事件", place: "地点", person: "人物", item: "物品",
    time: "时间", pattern: "模式", thought: "想法", community: "社区"
  };

  var allNodes = [];
  var allEdges = [];
  var nodeMap = {};
  var network = null;
  var nodesDs = null;
  var edgesDs = null;
  var activeTypes = {};
  var activeRelations = {};

  function setStatus(text, isError) {
    var el = document.getElementById("status-msg");
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function init() {
    document.getElementById("search-input").addEventListener("input", debounce(applyFilters, 200));
    document.getElementById("show-invalid").addEventListener("change", applyFilters);
    document.getElementById("refresh-btn").addEventListener("click", loadData);
    document.getElementById("detail-close").addEventListener("click", closeDetail);
    document.addEventListener("keydown", function(e) { if (e.key === "Escape") closeDetail(); });
    loadData();
  }

  function loadData() {
    setStatus("加载中...", false);
    fetch("/api/graph")
      .then(function(resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function(data) {
        console.log("Graph data loaded:", data.stats.total_nodes, "nodes,", data.stats.total_edges, "edges");
        allNodes = data.nodes;
        allEdges = data.edges;
        nodeMap = {};
        allNodes.forEach(function(n) { nodeMap[n.id] = n; });
        buildFilterUI(data.stats);
        renderStats(data.stats);
        initFilters(data.stats);
        renderGraph();
      })
      .catch(function(err) {
        console.error("Load error:", err);
        setStatus("加载数据失败: " + err.message, true);
      });
  }

  function buildFilterUI(stats) {
    var typeContainer = document.getElementById("type-filters");
    var types = Object.keys(TYPE_COLORS).filter(function(t) { return stats.nodes_by_type[t]; });
    typeContainer.innerHTML = types.map(function(t) {
      var color = TYPE_COLORS[t] ? TYPE_COLORS[t].bg : "#888";
      var label = TYPE_LABELS[t] || t;
      return '<label>' +
        '<input type="checkbox" value="' + t + '" checked onchange="onTypeFilterChange()">' +
        '<span class="color-dot" style="background:' + color + '"></span>' +
        label + ' (' + stats.nodes_by_type[t] + ')' +
        '</label>';
    }).join("");

    var relContainer = document.getElementById("relation-filters");
    var relations = stats.all_relations || [];
    if (relations.length === 0) {
      relContainer.innerHTML = '<span style="font-size:12px;color:var(--text-dim)">无边关系</span>';
    } else {
      relContainer.innerHTML = relations.map(function(r) {
        return '<label>' +
          '<input type="checkbox" value="' + r + '" checked onchange="onRelationFilterChange()">' +
          r + ' (' + (stats.edges_by_relation[r] || 0) + ')' +
          '</label>';
      }).join("");
    }
  }

  function initFilters(stats) {
    activeTypes = {};
    activeRelations = {};
    Object.keys(TYPE_COLORS).forEach(function(t) {
      if (stats.nodes_by_type[t]) activeTypes[t] = true;
    });
    (stats.all_relations || []).forEach(function(r) { activeRelations[r] = true; });
  }

  // 全局回调
  window.onTypeFilterChange = function() {
    activeTypes = {};
    document.querySelectorAll("#type-filters input[type=checkbox]").forEach(function(cb) {
      if (cb.checked) activeTypes[cb.value] = true;
    });
    applyFilters();
  };
  window.onRelationFilterChange = function() {
    activeRelations = {};
    document.querySelectorAll("#relation-filters input[type=checkbox]").forEach(function(cb) {
      if (cb.checked) activeRelations[cb.value] = true;
    });
    applyFilters();
  };

  function applyFilters() {
    if (!nodesDs || !edgesDs || !network) return;
    var searchTerm = document.getElementById("search-input").value.trim().toLowerCase();
    var showInvalid = document.getElementById("show-invalid").checked;

    var nodeView = nodesDs.get({ filter: function(n) {
      if (!activeTypes[n.type]) return false;
      if (!showInvalid && n.invalid) return false;
      if (searchTerm) {
        if ((n.content || "").toLowerCase().indexOf(searchTerm) === -1 &&
            (n.id || "").toLowerCase().indexOf(searchTerm) === -1) return false;
      }
      return true;
    }});

    var nodeIds = {};
    nodeView.forEach(function(n) { nodeIds[n.id] = true; });

    var edgeView = edgesDs.get({ filter: function(e) {
      if (!activeRelations[e.relation]) return false;
      if (!showInvalid && e.invalid) return false;
      return true;
    }});

    network.setData({ nodes: nodeView, edges: edgeView });

    var countEl = document.getElementById("search-count");
    countEl.textContent = searchTerm ? "匹配 " + nodeView.length + " 个节点" : "";
  }

  function renderGraph() {
    var container = document.getElementById("graph-container");
    var showInvalid = document.getElementById("show-invalid").checked;

    // 确保容器有尺寸
    var rect = container.getBoundingClientRect();
    console.log("Container size:", rect.width, "x", rect.height);

    var visibleNodes = allNodes.filter(function(n) {
      if (!activeTypes[n.type]) return false;
      if (!showInvalid && n.invalid) return false;
      return true;
    });

    var visibleEdges = allEdges.filter(function(e) {
      if (!activeRelations[e.relation]) return false;
      if (!showInvalid && e.invalid) return false;
      return true;
    });

    if (visibleNodes.length === 0) {
      setStatus("暂无图谱数据", false);
      if (network) { network.destroy(); network = null; }
      return;
    }
    setStatus("", false);

    var visNodes = visibleNodes.map(function(n) {
      var label = (n.content || n.id).length > 40
        ? (n.content || n.id).substring(0, 40) + "…"
        : (n.content || n.id);
      return {
        id: n.id,
        label: label,
        group: n.type,
        title: "<b>[" + (TYPE_LABELS[n.type] || n.type) + "]</b> " + (n.content || n.id),
        borderWidth: n.invalid ? 0 : 2,
        shapeProperties: { borderDashes: n.invalid ? [5, 5] : false },
        opacity: n.invalid ? 0.4 : 1.0,
        font: { color: n.invalid ? "#888" : "#e0e0e0", size: 12 },
        size: n.invalid ? 14 : (n.type === "pattern" || n.type === "thought" ? 22 : 18)
      };
    });

    var nodeIdSet = {};
    visNodes.forEach(function(n) { nodeIdSet[n.id] = true; });

    var visEdges = visibleEdges
      .filter(function(e) { return nodeIdSet[e.source] || nodeIdSet[e.target]; })
      .map(function(e) {
        return {
          from: e.source,
          to: e.target,
          label: e.relation,
          title: e.relation,
          width: Math.max(0.5, Math.min(4, (e.weight || 1) * 2)),
          arrows: { to: { enabled: true, scaleFactor: 0.6 } },
          color: { color: e.invalid ? "#444" : "#666", highlight: "#fff" },
          smooth: { type: "curvedCW", roundness: 0.15 },
          font: { size: 9, color: "#888", strokeWidth: 2, strokeColor: "#222", align: "middle" }
        };
      });

    nodesDs = new vis.DataSet(visNodes);
    edgesDs = new vis.DataSet(visEdges);

    var options = {
      nodes: { shape: "dot" },
      edges: { hoverWidth: 2, selectionWidth: 1 },
      physics: {
        solver: "forceAtlas2Based",
        forceAtlas2Based: {
          gravitationalConstant: -35,
          centralGravity: 0.005,
          springLength: 180,
          springConstant: 0.03,
          damping: 0.4
        },
        stabilization: { iterations: 200 }
      },
      interaction: {
        hover: true,
        hoverConnectedEdges: true,
        selectConnectedEdges: true,
        navigationButtons: true,
        keyboard: true,
        tooltipDelay: 300
      },
      groups: {}
    };

    // 构建 group 颜色
    Object.keys(TYPE_COLORS).forEach(function(t) {
      var c = TYPE_COLORS[t];
      options.groups[t] = {
        color: {
          background: c.bg,
          border: c.border,
          highlight: { background: c.bg, border: "#fff" }
        }
      };
    });

    if (network) { network.destroy(); network = null; }
    network = new vis.Network(container, { nodes: nodesDs, edges: edgesDs }, options);

    network.on("click", function(e) {
      if (e.nodes.length > 0) showDetail(e.nodes[0]);
      else closeDetail();
    });

    network.on("doubleClick", function(e) {
      if (e.nodes.length > 0) {
        network.focus(e.nodes[0], { scale: 1.5, animation: { duration: 400, easingFunction: "easeInOutQuad" } });
      }
    });

    console.log("Graph rendered:", visNodes.length, "nodes,", visEdges.length, "edges");
  }

  function renderStats(stats) {
    var maxNodes = Math.max.apply(null, [1].concat(Object.values(stats.nodes_by_type || {})));
    var typeBars = Object.entries(stats.nodes_by_type || {})
      .sort(function(a, b) { return b[1] - a[1]; })
      .map(function(entry) {
        var type = entry[0], count = entry[1];
        var color = (TYPE_COLORS[type] || {}).bg || "#888";
        var label = TYPE_LABELS[type] || type;
        var pct = Math.round((count / maxNodes) * 100);
        return '<div class="type-bar">' +
          '<span class="color-dot" style="background:' + color + ';width:8px;height:8px;"></span>' +
          '<span style="flex:1;min-width:60px;">' + label + '</span>' +
          '<span style="font-weight:600;">' + count + '</span>' +
          '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
          '</div>';
      }).join("");

    var topItems = (stats.most_accessed || []).slice(0, 5).map(function(n) {
      var color = (TYPE_COLORS[n.type] || {}).bg || "#888";
      var label = TYPE_LABELS[n.type] || n.type;
      return '<div class="top-item" onclick="focusNode(\'' + n.id + '\')" title="' + escHtml(n.content) + '">' +
        '<span class="top-type" style="background:' + color + '">' + label + '</span>' +
        escHtml((n.content || "").substring(0, 25)) +
        '<span style="float:right;color:var(--text-dim)">' + n.access_count + '</span>' +
        '</div>';
    }).join("");

    document.getElementById("stats-content").innerHTML =
      '<div class="stat-row"><span>有效节点</span><span class="val">' + stats.total_nodes + '</span></div>' +
      '<div class="stat-row"><span>有效边</span><span class="val">' + stats.total_edges + '</span></div>' +
      (stats.invalid_nodes > 0 ? '<div class="stat-row"><span>失效节点</span><span class="val" style="color:#FF6B6B">' + stats.invalid_nodes + '</span></div>' : "") +
      (stats.invalid_edges > 0 ? '<div class="stat-row"><span>失效边</span><span class="val" style="color:#FF6B6B">' + stats.invalid_edges + '</span></div>' : "") +
      '<h2 style="margin-top:4px;">按类型</h2>' + typeBars +
      '<h2 style="margin-top:4px;">最常访问</h2>' + (topItems || '<div style="font-size:11px;color:var(--text-dim)">无数据</div>');
  }

  function showDetail(nodeId) {
    var node = nodeMap[nodeId];
    if (!node) return;

    var panel = document.getElementById("detail-panel");
    var typeLabel = TYPE_LABELS[node.type] || node.type;
    var typeColor = (TYPE_COLORS[node.type] || {}).bg || "#888";

    document.getElementById("detail-type").textContent = typeLabel;
    document.getElementById("detail-type").style.background = typeColor;
    document.getElementById("detail-content").textContent = node.content || node.id;

    var metaHtml = "";
    metaHtml += '<div class="detail-meta-item"><span class="key">ID:</span> ' + node.id + '</div>';
    metaHtml += '<div class="detail-meta-item"><span class="key">类型:</span> ' + typeLabel + '</div>';
    if (node.access_count !== undefined) {
      metaHtml += '<div class="detail-meta-item"><span class="key">访问次数:</span> ' + node.access_count + '</div>';
    }
    if (node.last_accessed) {
      metaHtml += '<div class="detail-meta-item"><span class="key">最后访问:</span> ' + new Date(node.last_accessed * 1000).toLocaleString("zh-CN") + '</div>';
    }
    if (node.created_at !== undefined) {
      metaHtml += '<div class="detail-meta-item"><span class="key">创建(游戏日):</span> ' + (typeof node.created_at === "number" ? node.created_at.toFixed(2) : node.created_at) + '</div>';
    }
    if (node.metadata && Object.keys(node.metadata).length > 0) {
      Object.keys(node.metadata).forEach(function(k) {
        var v = node.metadata[k];
        var displayVal = typeof v === "object" ? JSON.stringify(v) : String(v);
        metaHtml += '<div class="detail-meta-item"><span class="key">' + k + ':</span> ' + escHtml(displayVal) + '</div>';
      });
    }
    if (node.invalid) {
      metaHtml += '<div class="detail-meta-item"><span class="key" style="color:#FF6B6B">状态:</span> <span style="color:#FF6B6B">已失效</span></div>';
    }
    if (node.summarized_to) {
      var parent = nodeMap[node.summarized_to];
      var parentLabel = parent ? (parent.content || parent.id).substring(0, 30) : node.summarized_to;
      metaHtml += '<div class="detail-meta-item"><span class="key">归纳至:</span> <span class="linked-node" onclick="focusNode(\'' + node.summarized_to + '\')">' + escHtml(parentLabel) + '</span></div>';
    }
    document.getElementById("detail-meta").innerHTML = metaHtml;

    var relatedEdges = allEdges.filter(function(e) { return e.source === nodeId || e.target === nodeId; });
    var edgesHtml = "";
    if (relatedEdges.length > 0) {
      edgesHtml += '<h3>关联关系 (' + relatedEdges.length + ')</h3>';
      relatedEdges.forEach(function(e) {
        var isSource = e.source === nodeId;
        var otherId = isSource ? e.target : e.source;
        var otherNode = nodeMap[otherId];
        var otherLabel = otherNode
          ? "[" + (TYPE_LABELS[otherNode.type] || otherNode.type) + "] " + (otherNode.content || "").substring(0, 30)
          : otherId;
        var dir = isSource ? "→" : "←";
        edgesHtml += '<div class="detail-edge-row">' +
          '<span class="edge-rel">' + e.relation + '</span>' +
          '<span>' + dir + '</span>' +
          '<span class="linked-node" onclick="focusNode(\'' + otherId + '\')">' + escHtml(otherLabel) + '</span>' +
          (e.invalid ? '<span class="detail-tag" style="background:#FF6B6B22;color:#FF6B6B">失效</span>' : "") +
          '</div>';
      });
    } else {
      edgesHtml = '<div style="font-size:12px;color:var(--text-dim)">无关联边</div>';
    }
    document.getElementById("detail-edges").innerHTML = edgesHtml;
    panel.classList.add("active");
  }

  function closeDetail() {
    document.getElementById("detail-panel").classList.remove("active");
  }

  window.focusNode = function(nodeId) {
    if (!network) return;
    network.selectNodes([nodeId]);
    network.focus(nodeId, { scale: 1.3, animation: { duration: 500, easingFunction: "easeInOutQuad" } });
    showDetail(nodeId);
  };

  function escHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function debounce(fn, ms) {
    var timer;
    return function() {
      var ctx = this, args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
    };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
